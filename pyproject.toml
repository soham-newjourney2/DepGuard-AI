[project]
name = "depguard-ai"
version = "0.1.0"
description = "Explain, prioritise and fix dependency vulnerabilities across eight ecosystems."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data", "samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF059", "PLW2901", "PLW1510", "PLC0207"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
    "e2e: browser end-to-end tests (playwright)",
    "live: hits real network services (OSV, npm, KEV/EPSS)",
]
